name: Build unsigned IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Locate Xcode project
        run: |
          set -euo pipefail
          PROJECT_PATH="$(find . -maxdepth 4 -name 'TivanONTiOS.xcodeproj' -type d -print -quit)"
          if [ -z "$PROJECT_PATH" ]; then
            echo "::error::TivanONTiOS.xcodeproj was not found."
            exit 1
          fi
          PROJECT_PATH="${PROJECT_PATH#./}"
          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_PATH"

      - name: Build iPhone app without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme TivanONTiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/TivanONTiOS.app"
          test -d "$APP_PATH"
          rm -rf Payload TivanONTiOS-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry TivanONTiOS-unsigned.ipa Payload
          /usr/bin/unzip -t TivanONTiOS-unsigned.ipa
          /usr/bin/zipinfo -1 TivanONTiOS-unsigned.ipa | sed -n '1,80p'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TivanONTiOS-unsigned-ipa
          path: TivanONTiOS-unsigned.ipa
          if-no-files-found: error
