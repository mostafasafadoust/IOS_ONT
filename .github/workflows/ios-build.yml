name: iOS build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  simulator-build:
    name: Build for iOS Simulator
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Locate Xcode project
        run: |
          set -euo pipefail
          echo "Repository tree:"
          find . -maxdepth 4 -type f | sort

          PROJECT_PATH="$(find . -maxdepth 4 -name 'TivanONTiOS.xcodeproj' -type d -print -quit)"
          if [ -z "$PROJECT_PATH" ]; then
            echo "::error::TivanONTiOS.xcodeproj was not found. Upload the project folder contents, including TivanONTiOS.xcodeproj."
            exit 1
          fi

          PROJECT_PATH="${PROJECT_PATH#./}"
          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_PATH"

      - name: List project
        run: xcodebuild -list -project "$PROJECT_PATH"

      - name: Build
        run: |
          set -o pipefail
          mkdir -p build/logs
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme TivanONTiOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build/logs/xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/logs/xcodebuild.log
          if-no-files-found: ignore

      - name: Package simulator app
        if: success()
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Debug-iphonesimulator -name 'TivanONTiOS.app' -maxdepth 2 -print -quit)"
          test -n "$APP_PATH"
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/artifacts/TivanONTiOS-simulator-app.zip

      - name: Upload simulator artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TivanONTiOS-simulator-app
          path: build/artifacts/TivanONTiOS-simulator-app.zip
